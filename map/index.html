<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Hytale Map — Waysider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="hamburger" id="menu-toggle" aria-label="Open panel">
      <span></span><span></span><span></span>
    </button>

    <div class="brand">
      <span class="titles">
        <h1 id="server-name">Hytale Map</h1>
        <small id="server-sub">Points of interest</small>
      </span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="Search places, bosses, portals…" autocomplete="off">
      <kbd>/</kbd>
    </div>

    <div class="top-actions">
      <button class="ghost" id="btn-login" hidden>Sign in</button>
      <span class="user-chip" id="user-chip" hidden>
        <span class="dot-online"></span>
        <span id="user-name"></span>
        <button class="icon" id="btn-signout" title="Sign out" aria-label="Sign out">⏻</button>
      </span>
      <button class="ghost" id="btn-share" title="Copy a link to this view">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Share</span>
      </button>
      <button class="ghost" id="btn-edit" title="Mark points of interest">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Mark</span>
      </button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h2>Points of interest</h2>
      <span class="count" id="poi-count">0</span>
    </div>

    <div class="filters" id="filters"></div>

    <div class="list-wrap">
      <ul class="poi-list" id="poi-list"></ul>
      <p class="empty" id="empty-msg" hidden>Nothing matches your search.</p>
    </div>

    <footer class="sidebar-foot">
      <span class="dot"></span>
      <span id="foot-text">Interactive map</span>
    </footer>
  </aside>

  <main class="map-wrap">
    <div id="map"></div>
    <div class="vignette"></div>

    <div class="coords" id="coords">
      <span class="coords-label">X</span><b id="cx">0</b>
      <span class="sep">·</span>
      <span class="coords-label">Z</span><b id="cz">0</b>
    </div>

    <div class="zoom-ctl">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zhome" title="Show the whole map">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="editbar" id="editbar" hidden>
      <span>Mark mode: click the map to add a point.</span>
      <button id="edit-clear">Clear all</button>
      <button id="edit-reset">Discard draft</button>
      <button id="edit-export">Download pois.json</button>
      <button id="edit-exit">Exit</button>
    </div>
  </main>
</div>

<!-- POI modal -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <header>
      <h3 id="modal-title">New point of interest</h3>
      <button class="icon" id="modal-close" aria-label="Close">✕</button>
    </header>
    <div class="modal-body">
      <label>Name
        <input id="f-name" type="text" maxlength="60" placeholder="e.g. Emberfall Keep">
      </label>
      <label>Category
        <div class="cat-picker" id="f-cats"></div>
      </label>
      <label><span>Description <small>(optional)</small></span>
        <textarea id="f-desc" rows="3" maxlength="240" placeholder="What's here, why visit…"></textarea>
      </label>
      <div class="coord-row">
        <span>Coordinates</span>
        <code id="f-coords">X 0 · Z 0</code>
      </div>
    </div>
    <footer>
      <button class="danger" id="f-delete" hidden>Delete</button>
      <div class="spacer"></div>
      <button class="ghost" id="f-cancel">Cancel</button>
      <button class="primary" id="f-save">Save point</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- login modal -->
<div class="modal" id="login-modal" hidden>
  <div class="modal-card login-card">
    <header>
      <h3>Team sign in</h3>
      <button class="icon" id="login-close" aria-label="Close">✕</button>
    </header>
    <div class="modal-body">
      <label>Username
        <input id="login-user" type="text" autocomplete="username" placeholder="yourname">
      </label>
      <label>Password
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••">
      </label>
      <p class="login-error" id="login-error" hidden></p>
    </div>
    <footer>
      <div class="spacer"></div>
      <button class="ghost" id="login-cancel">Cancel</button>
      <button class="primary" id="login-submit">Sign in</button>
    </footer>
  </div>
</div>

<script src="assets/vendor/leaflet.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/js/cloud.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
